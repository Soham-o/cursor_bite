name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test, lint, compile
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Install one Argos language pack (for translation-detection tests)
        # test_uninstalled_model_actionable_error and the installed-model
        # translation test need at least one real language pack present to
        # exercise their success paths — this is the one place the test
        # suite genuinely depends on something beyond pip packages. If this
        # step fails (e.g. Argos's package index is briefly unreachable),
        # it's allowed to fail without failing the whole job: the
        # dependent tests degrade to their "not installed" branch instead
        # of the job going red for a transient network hiccup unrelated to
        # the code being tested.
        continue-on-error: true
        run: |
          python -c "import argostranslate.package as p; p.update_package_index(); [pkg.install() for pkg in p.get_available_packages() if pkg.from_code == 'es' and pkg.to_code == 'en']"

      - name: Compile check
        run: python -m compileall -q app domain infrastructure ui utils config main.py

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest tests/ -q
