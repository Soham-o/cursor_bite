name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test, lint, compile
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      # Deliberately NOT installing a real Argos language pack here.
      #
      # An earlier version of this workflow did, so that
      # test_installed_model_translation and
      # test_uninstalled_model_actionable_error would exercise their
      # "pack present" branches in CI. A real CI run then failed: the
      # freshly-downloaded es->en model decoded "Hola mundo" into
      # repeated garbage subword tokens ("mainstre@@" x hundreds) instead
      # of a real translation — a CTranslate2/argostranslate decoding
      # failure, not a Cursor Bite bug, and not something this project's
      # code has any control over. Asserting on a live third-party
      # model's translation *quality* is not a property CI can reliably
      # gate on. Both tests already have an explicit "not installed"
      # branch (`if res.success: ...`) that this exercises instead — real
      # translation-quality coverage happens in a local dev environment
      # with a verified-working language pack, not in CI.

      - name: Compile check
        run: python -m compileall -q app domain infrastructure ui utils config main.py

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest tests/ -q
